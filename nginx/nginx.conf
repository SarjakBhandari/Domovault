user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Never leak the nginx version in Server: header or error pages.
    server_tokens off;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # -------------------------------------------------------------------------
    # TLS global settings (apply to all ssl servers below)
    # -------------------------------------------------------------------------

    # TLS 1.0 and 1.1 are deprecated (RFC 8996). Only 1.2 and 1.3 allowed.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Mozilla "Intermediate" cipher list for TLS 1.2 (TLS 1.3 ciphers are
    # non-negotiable and always enabled). All suites use ECDHE for forward
    # secrecy - a compromised private key cannot decrypt past sessions.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # Let the client pick from the safe list (TLS 1.3 manages this itself;
    # for TLS 1.2 the client often has a faster CHACHA20 than AES-GCM on
    # devices without AES-NI hardware).
    ssl_prefer_server_ciphers off;

    # Reuse negotiated TLS sessions for 1 day (reduces handshake overhead).
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Disable session tickets: the ticket key is not rotated here, so keeping
    # tickets on would weaken forward secrecy.
    ssl_session_tickets off;

    # OCSP stapling: reduces latency by embedding the revocation proof in the
    # TLS handshake. Only works with a real CA-signed certificate; leave off
    # with self-signed certs (no OCSP responder available).
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;

    # -------------------------------------------------------------------------
    # Shared proxy settings
    # -------------------------------------------------------------------------

    # Use HTTP/1.1 to the upstream so keep-alive and WebSocket upgrades work.
    proxy_http_version  1.1;
    proxy_set_header    Upgrade           $http_upgrade;
    proxy_set_header    Connection        "upgrade";
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Tell the app layer the original scheme so it can build correct URLs.
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_cache_bypass  $http_upgrade;
    proxy_read_timeout  60s;
    proxy_send_timeout  60s;

    # -------------------------------------------------------------------------
    # HTTP - redirect everything to HTTPS
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # 301 is permanent; use 302 during initial setup so browsers don't
        # cache the redirect before HTTPS is confirmed working.
        return 301 https://$host$request_uri;
    }

    # -------------------------------------------------------------------------
    # HTTPS - TLS termination + HTTP/2
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        # http2 on requires nginx >= 1.25.1 (nginx 1.27 used here).
        http2 on;

        server_name _;

        ssl_certificate     /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;

        # -----------------------------------------------------------------
        # Security response headers
        # -----------------------------------------------------------------

        # HSTS: instruct browsers to always use HTTPS for 2 years.
        # Remove "preload" if you have not submitted this domain to the
        # HSTS preload list.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Block this site from being embedded in iframes on other origins.
        add_header X-Frame-Options            "DENY"                              always;

        # Prevent MIME-type sniffing.
        add_header X-Content-Type-Options     "nosniff"                           always;

        # Limit information in the Referer header sent to third parties.
        add_header Referrer-Policy            "strict-origin-when-cross-origin"   always;

        # Disable the legacy XSS auditor (it introduced its own bypasses).
        add_header X-XSS-Protection           "0"                                 always;

        # Restrict browser features that the app does not need.
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

        # -----------------------------------------------------------------
        # Proxy to Next.js frontend (internal Docker network)
        # -----------------------------------------------------------------
        location / {
            proxy_pass http://frontend:3000;
        }

        # Pass the /api/* path to Next.js as well (it proxies to Express).
        # The separate location block allows finer-grained timeouts for API
        # calls vs. page loads in the future.
        location /api/ {
            proxy_pass         http://frontend:3000;
            proxy_read_timeout 120s;
        }
    }
}
