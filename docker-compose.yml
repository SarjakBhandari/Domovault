services:
  mongo:
    image: mongo:8.0@sha256:45b422ba19c0f028a917ea43746ab8e8cdbdaaeb50d2e6e634a17c59666e0dbb
    container_name: domovault-mongo
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    # Port NOT published: only the backend (on the internal compose network)
    # ever talks to Mongo.
    healthcheck:
      test:
        [
          "CMD", "mongosh", "--quiet",
          "-u", "${MONGO_ROOT_USERNAME}",
          "-p", "${MONGO_ROOT_PASSWORD}",
          "--authenticationDatabase", "admin",
          "--eval", "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: domovault-backend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - uploads_data:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/domovault?authSource=admin
      - UPLOAD_DIR=/app/uploads
      # CORS_ORIGIN is the public HTTPS origin that the browser sees (nginx).
      # Must use HTTPS now that TLS is terminated by nginx upstream.
      - CORS_ORIGIN=${CORS_ORIGIN:-https://localhost}
    # Not published: only the frontend (via the internal network) reaches it.
    expose:
      - "4000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - BACKEND_ORIGIN=http://backend:4000
    container_name: domovault-frontend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - BACKEND_ORIGIN=http://backend:4000
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    # Not published: nginx is the sole ingress point.
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_started

  nginx:
    build:
      context: ./nginx
    container_name: domovault-nginx
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx master runs as root to: bind ports < 1024 (NET_BIND_SERVICE),
    # chown temp dirs before forking (CHOWN), then workers drop to the nginx
    # user via setuid/setgid (SETUID + SETGID). All other capabilities dropped.
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  mongo-data:
  uploads_data:
